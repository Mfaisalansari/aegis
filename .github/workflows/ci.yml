name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # The unit test suite itself doesn't require real browser binaries
      # (every test that needs a Browser uses a hand-written fake — see
      # CONTRIBUTING.md), but installing them keeps this workflow closer
      # to a real build and lets any future browser-touching test run
      # for real instead of silently reporting "not available".
      - name: Install Playwright browsers
        run: mvn -B -pl aegis-core exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Build and test
        run: mvn -B clean verify
